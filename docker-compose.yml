services:
  metabase:
    build: ./metabase
    container_name: metabase-workshop
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      # deixa o warehouse.duckdb visível de dentro do container, em /data
      - ./warehouse:/data:ro
      # persiste a config/metadados do próprio Metabase entre restarts
      - metabase-data:/metabase-data
    restart: unless-stopped

volumes:
  metabase-data:
