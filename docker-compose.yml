services:
  metabase:
    build: ./metabase
    container_name: metabase-workshop
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      # deixa o warehouse.duckdb visível de dentro do container, em /data
      # (sem :ro: o driver DuckDB precisa escrever um arquivo .wal/lock ao
      # lado do .duckdb mesmo em consultas só de leitura, senão dá
      # "Read-only file system" ao abrir a conexão no Metabase)
      - ./warehouse:/data
      # persiste a config/metadados do próprio Metabase entre restarts
      - metabase-data:/metabase-data
    restart: unless-stopped

volumes:
  metabase-data:
